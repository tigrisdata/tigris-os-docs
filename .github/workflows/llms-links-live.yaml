name: llms.txt links live

# Requests every www.tigrisdata.com link in the deployed docs llms.txt and in
# the website llms.txt (see scripts/check-llms-links-live.js). The build check
# in test.yaml cannot see website routing, deploys, or the website llms.txt.
# A failure opens an issue, or adds a comment to the open one. A later pass
# closes it.
on:
  schedule:
    - cron: "17 14 * * *"
  # Vercel sends a deployment_status event when it deploys this repo.
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: llms-links-live
  cancel-in-progress: false

jobs:
  check:
    # Run for the schedule, for a manual run, and after a successful
    # production deploy. Skip the other deployment events (previews, pending).
    if: >-
      github.event_name != 'deployment_status' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'Production – tigris-os-docs')
    runs-on: namespace-profile-ubuntu-2404
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      ISSUE_TITLE: Broken links in the live llms.txt files
      RUN_URL:
        ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{
        github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Check the live llms.txt links
        id: check
        shell: bash
        run: node scripts/check-llms-links-live.js 2>&1 | tee report.txt

      - name: Open or update the issue
        if: failure() && steps.check.outcome == 'failure'
        shell: bash
        run: |
          {
            echo "The [live llms.txt link check]($RUN_URL) failed."
            echo
            echo '```text'
            tail -c 50000 report.txt
            echo '```'
          } > body.md
          number="$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg t "$ISSUE_TITLE" '[.[] | select(.title == $t)][0].number // empty')"
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file body.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file body.md
          fi

      - name: Close the issue
        if: success()
        shell: bash
        run: |
          number="$(gh issue list --state open --limit 200 --json number,title \
            | jq -r --arg t "$ISSUE_TITLE" '[.[] | select(.title == $t)][0].number // empty')"
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "The [live llms.txt link check]($RUN_URL) passes again."
          fi
